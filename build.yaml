targets:
  $default:
    builders:
      wb_generate|wb_device:
        enabled: true
      wb_generate|wb_config:
        enabled: false
    sources:
      include:
        - pubspec.*
        - lib/**
        - test/**
      exclude:
        - test/fixtures/missing_idevice.dart
        - test/fixtures/reverse_input_invalid.dart

builders:
  wb_device:
    import: "package:wb_generate/builder.dart"
    builder_factories: ["wbDeviceBuilder"]
    build_extensions: {".dart": [".wb.g.dart"]}
    auto_apply: dependents
    build_to: source
  wb_config:
    import: "package:wb_generate/builder.dart"
    builder_factories: ["wbConfigBuilder"]
    build_extensions: {"pubspec.yaml": ["lib/wb_config.g.dart"]}
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        include:
          - pubspec.yaml
